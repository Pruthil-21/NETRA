name: netra-live
x-logging: &stream-logging
  driver: local
  options:
    max-size: '10m'
    max-file: '3'

services:
  mediamtx:
    logging: *stream-logging
    image: bluenviron/mediamtx:1.20.0
    environment:
      MTX_AUTHINTERNALUSERS_2_USER: publisher
      MTX_AUTHINTERNALUSERS_2_PASS: '${MEDIAMTX_PUBLISH_PASSWORD:?set a separate hexadecimal publishing password}'
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_2_PERMISSIONS_0_PATH: '~^stream/(demo-|direct-)[a-zA-Z0-9-]+$$'
    container_name: netra-mediamtx
    restart: unless-stopped
    cpus: "${MEDIAMTX_CPUS:-2.0}"
    mem_limit: "${MEDIAMTX_MEMORY_LIMIT:-3g}"
    memswap_limit: "${MEDIAMTX_MEMORY_LIMIT:-3g}"
    ports:
      - "8554:8554"
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "8890:8890/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

  live-relay:
    logging: *stream-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.live
    container_name: netra-live-relay
    restart: unless-stopped
    cpus: "${LIVE_RELAY_CPUS:-4.0}"
    mem_limit: "${LIVE_RELAY_MEMORY_LIMIT:-2g}"
    memswap_limit: "${LIVE_RELAY_MEMORY_LIMIT:-2g}"
    init: true
    stop_grace_period: 20s
    depends_on:
      - mediamtx
    environment:
      PORTAL_URL: "${PORTAL_URL:-https://cctv.corp8.cloud}"
      MEDIAMTX_PUBLISH_PASSWORD: '${MEDIAMTX_PUBLISH_PASSWORD:?set publishing password}'
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_PORT: "8554"
      STREAM_PREFIX: direct
      CAMERA_LIMIT: "${CAMERA_LIMIT:-30}"
      RETRY_SECONDS: "${RETRY_SECONDS:-10}"
      MAX_RETRY_SECONDS: "${MAX_RETRY_SECONDS:-300}"
      CONNECT_INTERVAL_SECONDS: "${CONNECT_INTERVAL_SECONDS:-5}"
      RATE_LIMIT_SECONDS: "${RATE_LIMIT_SECONDS:-300}"
      MAX_RATE_LIMIT_SECONDS: "${MAX_RATE_LIMIT_SECONDS:-3600}"
      STALL_SECONDS: "${STALL_SECONDS:-45}"
      MIN_ONLINE_CAMERAS: "${MIN_ONLINE_CAMERAS:-1}"
      RELAY_FPS: "${RELAY_FPS:-15}"
      AUTH_REFRESH_SECONDS: "${AUTH_REFRESH_SECONDS:-600}"
      TRANSCODE_CAMERAS: "${TRANSCODE_CAMERAS:-^(cam09|cam15|cam18|cam24|cam27|cam29|cam30)$}"
      ORGANIZER_EMAIL_FILE: /run/secrets/organizer_email
      ORGANIZER_PASSWORD_FILE: /run/secrets/organizer_password
    secrets:
      - organizer_email
      - organizer_password
    healthcheck:
      test:
        - CMD-SHELL
        - /usr/local/bin/live-healthcheck
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  demo-replay:
    logging: *stream-logging
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-replay
    container_name: netra-demo-replay
    restart: unless-stopped
    cpus: "${DEMO_REPLAY_CPUS:-4.0}"
    mem_limit: "${DEMO_REPLAY_MEMORY_LIMIT:-2g}"
    memswap_limit: "${DEMO_REPLAY_MEMORY_LIMIT:-2g}"
    init: true
    stop_grace_period: 20s
    depends_on:
      - mediamtx
    environment:
      FOOTAGE_DIR: /demo-footage
      MEDIAMTX_PUBLISH_PASSWORD: '${MEDIAMTX_PUBLISH_PASSWORD:?set publishing password}'
      MEDIAMTX_HOST: mediamtx
      MEDIAMTX_PORT: "8554"
      RETRY_SECONDS: "5"
    volumes:
      - "${HOME}/Downloads/Demo_Footage:/demo-footage:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -T 5 -O /dev/null "http://mediamtx:8888/stream/demo-cam67/index.m3u8?cookieCheck=1"
      interval: 15s
      timeout: 7s
      retries: 8
      start_period: 60s

  cloudflared:
    logging: *stream-logging
    image: cloudflare/cloudflared:latest
    container_name: netra-cloudflared
    restart: unless-stopped
    cpus: "${CLOUDFLARED_CPUS:-0.5}"
    mem_limit: "${CLOUDFLARED_MEMORY_LIMIT:-256m}"
    memswap_limit: "${CLOUDFLARED_MEMORY_LIMIT:-256m}"
    depends_on:
      - mediamtx
    secrets:
      - cloudflare_tunnel_token
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token

secrets:
  cloudflare_tunnel_token:
    file: "${HOME}/.config/netra/cloudflare-tunnel-token"
  organizer_email:
    file: ./.organizer-email
  organizer_password:
    file: ./.organizer-password
