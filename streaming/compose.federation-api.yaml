# Optional authenticated control API. Never route this port through public HLS.
services:
  mediamtx:
    environment:
      MTX_API: 'yes'
      MTX_APIADDRESS: ':9997'
      MTX_AUTHINTERNALUSERS_0_USER: any
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: playback
      MTX_AUTHINTERNALUSERS_1_USER: federation
      MTX_AUTHINTERNALUSERS_1_PASS: '${MEDIAMTX_API_PASSWORD:?set a random hexadecimal API password}'
      MTX_AUTHINTERNALUSERS_1_IPS: ''
      MTX_AUTHINTERNALUSERS_1_PERMISSIONS_0_ACTION: api
    ports:
      - '127.0.0.1:9997:9997'
