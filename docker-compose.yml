version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: netra
      POSTGRES_PASSWORD: netra
      POSTGRES_DB: netra
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend-registry/app/schema.sql:/docker-entrypoint-initdb.d/01-registry-schema.sql:ro
      - ./backend-watchlist/app/schema.sql:/docker-entrypoint-initdb.d/02-watchlist-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netra -d netra"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      # Playback API -- backs the recorded-footage timeline (see
      # streaming/README.md's "Recorded footage / VOD playback" section).
      - "9996:9996"
    volumes:
      - ./streaming/mediamtx.yml:/mediamtx.yml
      # recordPath in mediamtx.yml is a relative path (./recordings/...),
      # which resolves inside the container -- without this mount, every
      # recorded segment lived only in the container's writable layer and
      # was silently lost on every restart/recreate.
      - mediamtx_recordings:/recordings

  backend-registry:
    build:
      context: ./backend-registry
    environment:
      DATABASE_URL: "postgresql://netra:netra@db:5432/netra"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      # Required for the tunneled recording-health webhook sink
      # (routers/recording_webhooks.py) to actually accept Dhruv's calls --
      # without this, the publicly-reachable container 401s every request
      # even with the right token, since it never learned the key existed.
      RECORDING_WEBHOOK_KEY: "${RECORDING_WEBHOOK_KEY:-}"
      # Outbound side of the same integration -- lets this container proxy
      # GET /cameras/{id}/recordings and /recordings/health to Dhruv's
      # recording service (see services/recordings_service.py). Optional:
      # unset means those endpoints just report "unavailable".
      RECORDING_SERVICE_URL: "${RECORDING_SERVICE_URL:-}"
      RECORDING_SERVICE_KEY: "${RECORDING_SERVICE_KEY:-}"
    ports:
      - "${REGISTRY_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Single-node KRaft broker (no Zookeeper) -- backs alert delivery
  # (backend-watchlist/app/services/kafka_client.py). Entirely optional at
  # runtime: that service checks reachability itself and falls back to
  # broadcasting alerts directly when this container isn't up, so it's safe
  # to `docker compose up` without this or stop it independently.
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:19093,EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:19093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: unless-stopped

  backend-watchlist:
    build:
      context: ./backend-watchlist
    environment:
      DATABASE_URL: "postgresql://netra:netra@db:5432/netra"
      JWT_SECRET: "${JWT_SECRET:-dev-jwt-secret-change-me}"
      INTERNAL_SERVICE_KEY: "${INTERNAL_SERVICE_KEY:-dev-internal-key}"
      # From inside the compose network, not the host-published port above.
      KAFKA_BROKERS: "kafka:19092"
    ports:
      - "${WATCHLIST_HOST_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Named Cloudflare Tunnel (api.digdhrishti.me -> backend-watchlist:8001).
  # Ingress rules live in the Cloudflare Zero Trust dashboard for this
  # tunnel, not in a local config file -- the token is the only secret
  # needed here. Optional: leaving CLOUDFLARE_TUNNEL_TOKEN unset just means
  # this service exits immediately: everything else in the stack still
  # comes up and runs on localhost as normal.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: netra-backend-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend-watchlist

  # Named Cloudflare Tunnel for backend-registry -- needed so external
  # service-to-service callers (e.g. the DIGDHRISHTI continuous-recording
  # service's recording-health webhook, see
  # backend-registry/app/routers/recording_webhooks.py) can reach it at
  # all; before this it only ever existed on localhost. Same pattern as the
  # backend-watchlist tunnel above: a dedicated tunnel/token, hostname ->
  # local service mapping (point it at backend-registry:8000, the
  # in-network container port, not the host-published one) lives in the
  # Cloudflare Zero Trust dashboard for THIS tunnel, not here. Optional:
  # leaving CLOUDFLARE_REGISTRY_TUNNEL_TOKEN unset just means this service
  # exits immediately, same as the other cloudflared service -- everything
  # else in the stack still runs on localhost as normal.
  cloudflared-registry:
    image: cloudflare/cloudflared:latest
    container_name: netra-registry-cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_REGISTRY_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - backend-registry

volumes:
  db_data:
  mediamtx_recordings:
