name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-registry:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-registry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Run tests (if any exist)
        run: |
          if find . -iname "test_*.py" -o -iname "*_test.py" | grep -q .; then
            pytest
          else
            echo "No test files found yet -- skipping pytest."
          fi

  backend-watchlist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-watchlist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Run tests (if any exist)
        run: |
          if find . -iname "test_*.py" -o -iname "*_test.py" | grep -q .; then
            pytest
          else
            echo "No test files found yet -- skipping pytest."
          fi

  frontend-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-map/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  frontend-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
