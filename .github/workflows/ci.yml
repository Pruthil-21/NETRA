name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-registry:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend-registry
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netra_test
      JWT_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Apply schema (if any .sql files exist)
        run: |
          if [ -n "$(find . -iname '*.sql' 2>/dev/null)" ]; then
            export PGPASSWORD=postgres
            for f in $(find . -iname '*.sql' | sort); do
              echo "Applying $f"
              psql -h localhost -U postgres -d netra_test -f "$f"
            done
          else
            echo "No .sql files found -- skipping schema setup."
          fi
      - name: Run tests (if any exist)
        run: |
          if find . -iname "test_*.py" -o -iname "*_test.py" | grep -q .; then
            pytest
          else
            echo "No test files found yet -- skipping pytest."
          fi

  backend-watchlist:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend-watchlist
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netra_test
      JWT_SECRET: ci-test-secret-not-for-production
      INTERNAL_SERVICE_KEY: dev-internal-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Apply schema (if any .sql files exist)
        run: |
          if [ -n "$(find . -iname '*.sql' 2>/dev/null)" ]; then
            export PGPASSWORD=postgres
            for f in $(find . -iname '*.sql' | sort); do
              echo "Applying $f"
              psql -h localhost -U postgres -d netra_test -f "$f"
            done
          else
            echo "No .sql files found -- skipping schema setup."
          fi
      - name: Run tests (if any exist)
        run: |
          if find . -iname "test_*.py" -o -iname "*_test.py" | grep -q .; then
            pytest
          else
            echo "No test files found yet -- skipping pytest."
          fi

  frontend-map:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-map/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  frontend-dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
